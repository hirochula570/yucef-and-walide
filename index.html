<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YUCEF AND WALIDE — Boutique Mode Maroc</title>
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --bg-card: #F3EEE6;
      --text-black: #111111;
      --text-muted: #5C5852;
      --border-color: #E5DFD5;
      --accent-black: #111111;
      --accent-hover: #2C2C2C;
      --danger-red: #B00020;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, Arial, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-black);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .top-bar {
      background-color: var(--text-black);
      color: var(--bg-cream);
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 16px;
      font-weight: 500;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(250, 247, 242, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-black);
    }

    .cart-trigger {
      position: relative;
      background: transparent;
      border: 1px solid var(--text-black);
      color: var(--text-black);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .cart-trigger:hover {
      background: var(--text-black);
      color: var(--bg-cream);
    }

    .cart-badge {
      background: var(--text-black);
      color: var(--bg-cream);
      font-size: 11px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .cart-trigger:hover .cart-badge {
      background: var(--bg-cream);
      color: var(--text-black);
    }

    .hero {
      padding: 36px 20px 24px;
      max-width: 1160px;
      margin: 0 auto;
      border-bottom: 1px solid var(--border-color);
    }

    .hero-eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 540px;
    }

    .filters {
      max-width: 1160px;
      margin: 0 auto;
      padding: 18px 20px 6px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-black);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--text-black);
      color: var(--bg-cream);
      border-color: var(--text-black);
    }

    .catalog {
      max-width: 1160px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
    }

    @media (min-width: 680px) {
      .catalog {
        grid-template-columns: repeat(2, 1fr);
        gap: 32px 24px;
      }
    }

    @media (min-width: 1024px) {
      .catalog {
        grid-template-columns: repeat(3, 1fr);
        gap: 40px 28px;
      }
    }

    .product-card {
      display: flex;
      flex-direction: column;
    }

    .product-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: var(--bg-card);
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img-wrap img {
      transform: scale(1.03);
    }

    .img-missing {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 700;
    }

    .product-price {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .size-group {
      display: flex;
      gap: 6px;
    }
